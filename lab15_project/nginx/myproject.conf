##############################################################
# Nginx конфигурациясы - myproject
# Зертханалық жұмыс №15
##############################################################

# Gunicorn процестерінің тобы (upstream)
upstream django_app {
    # Gunicorn 8000 портта тыңдайды
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # -------------------------------------------------------
    # Статикалық файлдар - Nginx тікелей береді (Django-ны айналып өтеді)
    # 'python manage.py collectstatic' файлдарды осы қалтаға жинайды
    # -------------------------------------------------------
    location /static/ {
        alias /var/www/myproject/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Медиа файлдар
    location /media/ {
        alias /var/www/myproject/media/;
        expires 7d;
    }

    # -------------------------------------------------------
    # Динамикалық сұраулар - Gunicorn-ға (Django-ға) жіберіледі
    # -------------------------------------------------------
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймаут параметрлері
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Максималды жүктеу өлшемі
    client_max_body_size 10M;

    # Қауіпсіздік тақырыптары
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}
